# GRPO on single_count questions with a GRADED correctness reward.
#
# Identical to configs/count.yaml except for the two `count_partial_credit`
# keys below, so a run against this config is a clean A/B of the reward shape.
#
# Motivation (measured, see README "Diagnosing a weak training signal"):
# instrumenting a run of configs/count.yaml found 38.4% of GRPO groups
# uniformly wrong and 0% uniformly correct. A binary reward makes those groups
# gradient-free, so a third of the rollout budget taught nothing about
# counting — and in those groups the only surviving signal was the format term,
# which is exactly what the training curve shows being learned (format reward
# 0.14 -> 0.96 in 20 steps while correctness stayed flat).
#
# Run:  sbatch slurm/train.slurm configs/count_graded.yaml
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
dataset_dir: data/count
output_dir: outputs/count-graded-qwen2.5-0.5b

correctness_weight: 1.0
format_weight: 0.2

# --- graded correctness ----------------------------------------------------
# A count answer the official verifier rejects earns
#     count_partial_credit * exp(-|predicted - true| / count_partial_tau)
# so a group of uniformly wrong completions is ordered by how close each got.
# Capped at 0.15 * exp(-1/3) = 0.107, an order of magnitude below the 1.0 an
# exact answer scores, so the optimum is unchanged — only the gradient around
# it becomes informative. Set to 0.0 to fall back to the binary reward.
# Applies to count tasks only; index and constraint keep the binary reward.
count_partial_credit: 0.15
count_partial_tau: 3.0

grpo:
  output_dir: outputs/count-graded-qwen2.5-0.5b
  per_device_train_batch_size: 16    # larger OOMs 64GB A100 (logits are batch x len x 152k vocab)
  gradient_accumulation_steps: 16    # set to 4 on 4 GPUs
  num_generations: 16
  max_completion_length: 512
  temperature: 1.0
  top_p: 1.0
  learning_rate: 1.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 20
  max_steps: 500
  max_grad_norm: 1.0
  beta: 0.0
  bf16: true
  gradient_checkpointing: true
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.25
  vllm_max_model_length: 2048
  logging_steps: 1
  save_steps: 100
  save_total_limit: 3
  report_to: ["tensorboard"]
  seed: 42
